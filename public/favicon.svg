<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" stop-color="#22d3ee" />
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Futuristic Hexagon or H-Shape -->
  <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="none" stroke="url(#neon-grad)" stroke-width="4" filter="url(#glow)" />
  <text x="50" y="62" font-family="'Syne', 'sans-serif'" font-weight="900" font-size="34" fill="#fff" text-anchor="middle" letter-spacing="1">SH</text>
</svg>
